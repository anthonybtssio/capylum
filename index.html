<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3F3FD4">
<meta name="description" content="Capylum : simule ta vie et apprends à gérer ton argent en jouant (budget, logement, voiture, maison, investissements).">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capylum">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Capylum · Ma vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<style>
:root{
  --indigo:#3F3FD4;--indigo-d:#2D2DA6;--coral:#E0605F;--grass:#8DB36B;
  --ink:#2F3142;--muted:#8A8FA3;--line:#E6E8F0;--card:#FFFFFF;--bg:#F4F6FB;
  --good:#24A866;--good-bg:#E2F7EC;--bad:#E5484D;--bad-bg:#FDE8E8;--warn:#F59E0B;--neu-bg:#ECECFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;font-weight:700;color:var(--ink);background:var(--grass);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- VILLE ---------- */
#city{position:fixed;inset:0;overflow:hidden;touch-action:none}
#city canvas{display:block;width:100%;height:100%}
.haze{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(rgba(255,255,255,0),rgba(236,246,226,.55));pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;left:0;top:0;pointer-events:auto;border:none;background:var(--bc);color:#fff;border-radius:999px;padding:8px 15px 8px 11px;
  font-weight:900;font-size:14px;display:flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 6px 14px rgba(25,25,110,.28);--bc:var(--indigo);will-change:transform}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--bc)}
.bub .ico{font-size:16px}
.bub .badge{position:absolute;top:-8px;right:-8px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;border:2.5px solid #fff;font-size:11px;color:#fff}
.bub.done .badge{background:#2DB36F}
.bub.active{z-index:2;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 14px rgba(25,25,110,.28),0 0 0 0 rgba(63,63,212,.45)}50%{box-shadow:0 6px 14px rgba(25,25,110,.28),0 0 0 10px rgba(63,63,212,0)}}
.bub.locked{--bc:#B7BBC9;color:#F2F3F8}
.bub.locked .badge{background:#5E6275}
.bub.off{--bc:rgba(112,122,165,.55);color:rgba(255,255,255,.85)}
.bub.off .badge{background:rgba(70,75,100,.6)}
.tag3d{position:absolute;left:0;top:0;background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap}
.calcard{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));left:16px;background:#fff;border-radius:16px;width:150px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.calcard .band{height:24px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,#E5484D,#F7A23B)}
.calcard .rg{position:absolute;top:-9px;width:9px;height:20px;border-radius:6px;background:#2F3142}
.calcard b{display:block;color:#6B6F80;font-size:16px;line-height:1.05;letter-spacing:1.5px;padding:8px 6px 4px;font-weight:900}
.calcard small{display:block;color:var(--muted);font-size:12px;padding-bottom:9px}
.wallet{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;border-radius:999px;display:flex;align-items:center;gap:12px;padding:7px 78px 7px 7px;box-shadow:0 10px 26px rgba(0,0,0,.16);border:none;color:var(--ink);text-align:left}
.wallet .ring{position:relative;width:58px;height:58px}
.wallet .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.wallet .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:900;color:#1E7A4A}
.wallet small{display:block;color:var(--muted);font-size:12.5px}
.wallet b{display:block;font-size:24px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.wallet .av{position:absolute;right:-14px;top:50%;transform:translateY(-50%);width:76px;height:76px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 4px var(--coral),0 6px 14px rgba(0,0,0,.18);overflow:hidden;background:#DDE3F3}
.filters{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;border-radius:999px;display:flex;box-shadow:0 6px 18px rgba(0,0,0,.14);overflow:hidden}
.filters button{background:none;border:none;padding:9px 18px;color:var(--coral);display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
.filters button+button{border-left:1.5px solid #EEE}
.filters svg{width:20px;height:20px}
.hint{position:absolute;bottom:calc(160px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(47,49,66,.78);color:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
#fallback{position:absolute;inset:0;display:none;padding:150px 16px 170px;overflow:auto;background:var(--grass)}
#fallback .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 14px;max-width:700px;margin:0 auto}
#fallback .lot{position:relative;background:#7FA65E;border-radius:16px;height:110px;display:flex;align-items:flex-end;justify-content:center;font-size:56px;padding-bottom:6px}
#fallback .bub{position:absolute;left:50%;top:-14px;transform:translateX(-50%)}

/* ---------- PLATEAU ---------- */
#board{position:fixed;inset:0;background:linear-gradient(180deg,#8CCBF5 0%,#D9F0FF 55%,#BFE0A8 100%);overflow:hidden;z-index:5}
.bwrap{max-width:720px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}
.bhead{position:sticky;top:0;z-index:4;background:var(--pc);color:#fff;margin:0 -14px;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bh1{display:flex;align-items:center;gap:10px}
.bback{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px}
.btitle{flex:1;min-width:0}
.btitle b{display:block;font-size:19px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btitle small{opacity:.9;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bav{width:46px;height:46px;border-radius:50%;border:3px solid #fff;overflow:hidden;flex:none;background:#DDE3F3}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.st{flex:1;min-width:0;background:rgba(255,255,255,.17);border-radius:14px;padding:7px 10px}
.st small{display:block;font-size:11.5px;opacity:.9}
.st b{font-size:17px;font-weight:900;white-space:nowrap}
.st.neg b{color:#FFD3D3}
.joybar{height:7px;border-radius:6px;background:rgba(255,255,255,.3);margin-top:5px;overflow:hidden}
.joybar i{display:block;height:100%;background:#FFE36E;border-radius:6px}
.goal{background:#fff;border-radius:16px;margin:14px 0 10px;padding:11px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05);font-size:14px}
.goal .gb{height:9px;border-radius:8px;background:var(--line);margin-top:7px;overflow:hidden}
.goal .gb i{display:block;height:100%;background:linear-gradient(90deg,#F7A23B,#24A866);border-radius:8px;transition:width .5s}
.cal{position:relative;background:#fff;border-radius:20px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wk div{text-align:center;font-size:11px;color:var(--muted);font-weight:900;padding:2px 0 5px}
.tile{position:relative;min-width:0;aspect-ratio:1/1.05;border-radius:11px;background:var(--tc,#F3F4F8);border:2px solid rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;padding:0;font-size:clamp(15px,4.6vw,24px);transition:transform .15s;color:var(--ink)}
.tile .n{position:absolute;top:2px;left:5px;font-size:10px;font-weight:900;color:rgba(47,49,66,.55)}
.tile .amt{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;color:rgba(47,49,66,.65)}
.tile.past{opacity:.38}
.tile.now{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc)}
.tile.empty{background:transparent;border:none}
.pawn{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px var(--coral),0 5px 10px rgba(0,0,0,.25);overflow:hidden;transition:left .2s ease,top .2s ease;z-index:3;background:#DDE3F3;pointer-events:none}
.pawn.hop{animation:hop .22s ease}
@keyframes hop{50%{transform:translateY(-12px) scale(1.08)}}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(244,246,251,.94);backdrop-filter:blur(6px);border-top:1.5px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.controls .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.rollbtn{flex:1;border:none;border-radius:18px;padding:16px;font-size:18px;font-weight:900;color:#fff;background:var(--pc);box-shadow:0 5px 0 rgba(0,0,0,.18);letter-spacing:.3px}
.rollbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.rollbtn:disabled{opacity:.5}
.sqbtn{border:none;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line),0 0 0 1.5px var(--line);padding:10px 12px;font-size:12px;font-weight:900;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.sqbtn span{font-size:20px}
.dwrap{width:58px;height:58px;perspective:500px;flex:none}
.dice{width:58px;height:58px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.75,.25,1)}
.face{position:absolute;inset:0;background:#fff;border:2px solid #E1E4EE;border-radius:13px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px}
.face i{width:10px;height:10px;border-radius:50%;background:var(--ink);place-self:center}
.f1{transform:translateZ(29px)}.f6{transform:rotateY(180deg) translateZ(29px)}.f2{transform:rotateY(90deg) translateZ(29px)}
.f5{transform:rotateY(-90deg) translateZ(29px)}.f3{transform:rotateX(90deg) translateZ(29px)}.f4{transform:rotateX(-90deg) translateZ(29px)}
.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:900;margin:18px 4px 8px}
.stmt{background:#fff;border-radius:18px;padding:4px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stmt .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--line);font-size:14px}
.stmt .r:last-child{border:none}
.stmt .d{color:var(--muted);font-size:12px;margin-right:6px}
.pos{color:var(--good)}.neg{color:var(--bad)}.sav{color:var(--indigo)}.muted{color:var(--muted)}

/* ---------- MODALES ---------- */
#modal .ov{position:fixed;inset:0;z-index:20;background:rgba(25,27,45,.5);display:flex;align-items:flex-end;justify-content:center;padding:14px}
@media (min-width:640px){#modal .ov{align-items:center}}
.sheet{background:#fff;border-radius:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1.15);box-shadow:0 20px 50px rgba(0,0,0,.25)}
@keyframes up{from{transform:translateY(40px) scale(.97);opacity:0}}
.sh{background:var(--tc,var(--indigo));color:#fff;padding:16px 18px 18px;position:relative}
.sh .ty{display:flex;justify-content:space-between;font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;opacity:.95}
.sh .em{font-size:52px;line-height:1;margin:8px 0 4px}
.sh h3{margin:0;font-size:22px;font-weight:900}
.sb{padding:16px 18px 18px}
.sb p{margin:0 0 14px;font-size:16px;line-height:1.45;color:#45485A}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 13px;background:#fff;font-size:15.5px;font-weight:800;color:var(--ink);width:100%}
.opt:hover:not(:disabled){border-color:#C8CBF5;background:#FAFAFF}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt:disabled{opacity:.45}
.opt small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:45%}
.chip{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;background:#F1F2F7;white-space:nowrap}
.chip.neg{background:var(--bad-bg);color:var(--bad)}.chip.pos{background:var(--good-bg);color:var(--good)}
.chip.sav{background:var(--neu-bg);color:var(--indigo)}.chip.joy{background:#FFF6D6;color:#B07800}
.verdict{border-radius:16px;padding:14px;margin-bottom:12px}
.verdict b{display:block;font-size:19px;font-weight:900;margin-bottom:5px}
.verdict.good{background:var(--good-bg);color:#17734A}.verdict.bad{background:var(--bad-bg);color:#B3262B}.verdict.neu{background:var(--neu-bg);color:var(--indigo-d)}
.verdict p{margin:0;color:inherit;font-size:15px}.verdict p b{display:inline;font-size:inherit;margin:0}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:900;color:#fff;background:var(--tc,var(--indigo));box-shadow:0 4px 0 rgba(0,0,0,.18);margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#F1F2F7;color:var(--ink);box-shadow:0 4px 0 #DEE0EA}
.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:15px}
.row+.row{border-top:1.5px dashed var(--line)}
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 4px;font-size:44px}
.stars span{filter:grayscale(1);opacity:.25;transition:.3s}
.stars span.on{filter:none;opacity:1;animation:pop .45s cubic-bezier(.3,1.7,.6,1) backwards}
@keyframes pop{from{transform:scale(.2)}}
.slist .row{font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--indigo)}
.sw .tx{width:auto;height:auto;border-radius:12px;padding:8px 12px;background:#F1F2F7;border:none;box-shadow:none;font-weight:900;color:var(--ink)}
.sw .tx.on{background:var(--neu-bg);color:var(--indigo);box-shadow:0 0 0 2px var(--indigo)}
.lbl{font-size:13px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.5px}
input.name{width:100%;font:inherit;font-size:17px;font-weight:800;padding:11px 14px;border-radius:14px;border:2px solid var(--line);margin:6px 0 14px;color:var(--ink)}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 6px}
.amts button{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;padding:10px 4px;font-weight:900;font-size:14px;color:var(--ink)}
.amts button.on{border-color:var(--indigo);background:var(--neu-bg);color:var(--indigo)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 28px);max-width:420px}
#toast div{background:#fff;color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.18);animation:up .25s;text-align:center;font-size:14.5px}
#toast div.neg{color:var(--bad)}#toast div.pos{color:var(--good)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

#onb{position:fixed;inset:0;z-index:15;overflow:auto;background:linear-gradient(180deg,#BFE3FF 0%,#E9F7DF 55%,#8DB36B 100%);display:flex;align-items:center;justify-content:center;padding:20px 14px}
.ob{width:100%;max-width:480px;background:#fff;border-radius:26px;padding:22px;box-shadow:0 20px 50px rgba(30,40,80,.18);animation:up .3s;margin:auto}
.obp{height:10px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:14px}.obp i{display:block;height:100%;background:linear-gradient(90deg,#3F3FD4,#8B5CF6);border-radius:8px;transition:width .4s}
.ob .em{font-size:54px;text-align:center;line-height:1.1}
.ob h2{text-align:center;font-size:23px;font-weight:900;margin:6px 0 4px}
.ob .sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:15px}
.obo{display:grid;gap:10px;margin-bottom:6px}.obo.two{grid-template-columns:1fr 1fr}
.obb{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:#fff;padding:13px;font-size:15.5px;font-weight:900;color:var(--ink);text-align:left}
.obb span{font-size:26px}.obb:active{transform:translateY(2px);border-bottom-width:3px}
.obb.on{border-color:var(--indigo);background:var(--neu-bg);color:var(--indigo)}
.obb.right{border-color:var(--good);background:var(--good-bg);color:#17734A}.obb.wrong{border-color:var(--bad);background:var(--bad-bg);color:#B3262B}
.obb:disabled{opacity:1}
.pcard{border-radius:20px;padding:18px;text-align:center;color:#fff;background:linear-gradient(135deg,#3F3FD4,#8B5CF6);margin-bottom:14px}
.pcard .big{font-size:58px;line-height:1.1}.pcard b{display:block;font-size:24px;font-weight:900}
.pchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.pchips span{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:13px}
.adapt{list-style:none;padding:0;margin:0 0 6px}.adapt li{padding:9px 0;border-bottom:1.5px dashed var(--line);font-size:14.5px;line-height:1.4}
.bub.dream{--bc:#F2B400;color:#3A2A00}

#sky{position:absolute;inset:0;background:linear-gradient(180deg,#4FA8EE,#D3EEFF)}
#stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%;opacity:0;transition:opacity 1s}
#orb{position:absolute;left:80%;top:12%;width:90px;height:90px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#FFF8DA 0 30%,rgba(255,232,160,.55) 34%,rgba(255,232,160,0) 70%)}
#orb.moon{background:radial-gradient(circle at 42% 42%,#FFFFFF 0 24%,#DCE4FF 28%,rgba(200,215,255,.3) 34%,rgba(200,215,255,0) 68%)}
#city canvas{position:absolute;inset:0}
#labels{opacity:0;transition:opacity .7s}#labels.ready{opacity:1}
@media (max-width:600px){.bub:not(.active) .lb{display:none}.bub:not(.active){padding:7px 10px}.bub.dream .lb{display:none}}
.topr{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:3}
.chipbtn{border:none;background:rgba(255,255,255,.92);border-radius:999px;padding:8px 14px;font-weight:900;font-size:13.5px;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.14);display:flex;gap:6px;align-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chipbtn small{color:var(--muted);font-size:11px}
#instBtn{background:var(--indigo);color:#fff;animation:pulse 2s ease-in-out infinite}
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(180deg,#BFE3FF,#E9F7DF 60%,#8DB36B);transition:opacity .7s}
#loader.gone{opacity:0;pointer-events:none}
.ldr{text-align:center}.ldr img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 30px rgba(63,63,212,.3);animation:bob2 1.6s ease-in-out infinite}
.ldr b{display:block;font-size:30px;font-weight:900;color:#3F3FD4;margin-top:14px}.ldr small{color:#5C6278}
.ldr .lb{width:170px;height:8px;border-radius:6px;background:rgba(63,63,212,.15);margin:14px auto 0;overflow:hidden}.ldr .lb i{display:block;width:40%;height:100%;background:#3F3FD4;border-radius:6px;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}@keyframes bob2{50%{transform:translateY(-8px)}}
#wipe{position:fixed;inset:0;z-index:30;pointer-events:none;clip-path:circle(0px at var(--x,50%) var(--y,50%));-webkit-clip-path:circle(0px at var(--x,50%) var(--y,50%));display:grid;place-items:center;font-size:96px}
#wipe.on{clip-path:circle(150% at var(--x,50%) var(--y,50%));-webkit-clip-path:circle(150% at var(--x,50%) var(--y,50%));transition:clip-path .5s cubic-bezier(.65,0,.35,1),-webkit-clip-path .5s cubic-bezier(.65,0,.35,1)}
#wipe.on.out{opacity:0;transition:opacity .45s ease}
.tabs2{display:flex;background:#F1F2F7;border-radius:14px;padding:4px;margin-bottom:12px}.tabs2 button{flex:1;border:none;background:none;border-radius:11px;padding:10px;font-weight:900;color:var(--muted);font-size:14.5px}.tabs2 button.on{background:#fff;color:var(--indigo);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.steps{list-style:none;margin:0 0 6px;padding:0;counter-reset:s}.steps li{position:relative;padding:10px 0 10px 44px;border-bottom:1.5px dashed var(--line);font-size:15px;line-height:1.45}.steps li:last-child{border:none}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--neu-bg);color:var(--indigo);display:grid;place-items:center;font-weight:900}
.ki{display:inline-grid;place-items:center;vertical-align:middle;width:28px;height:28px;border-radius:8px;background:#F1F2F7;margin:0 2px;color:#2F7DD8}.ki svg{width:18px;height:18px}
.phone{margin:4px auto 12px;width:210px;height:150px;border-radius:28px;border:7px solid #2F3142;background:linear-gradient(#BFE3FF,#E9F7DF);position:relative;overflow:hidden}
.phone .scr{position:absolute;inset:40px 0 38px;display:grid;place-items:center}.phone .scr img{width:44px;height:44px;border-radius:11px}
.phone .bar{position:absolute;left:0;right:0;bottom:0;height:36px;background:#F7F7FA;display:flex;justify-content:space-around;align-items:center;color:#2F7DD8;font-size:15px}
.phone .top{position:absolute;left:0;right:0;top:0;height:34px;background:#F7F7FA;display:flex;justify-content:flex-end;align-items:center;padding-right:8px;gap:6px;color:#5C6278;font-size:12px}
.phone .hl{animation:hl 1.3s ease-in-out infinite}@keyframes hl{50%{box-shadow:0 0 0 6px rgba(63,63,212,.35);background:#E6E6FF}}
@media (min-width:1000px){
 .bwrap{max-width:1180px}
 .bgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:22px;align-items:start}
 .bside{position:sticky;top:200px}

 .controls .in{max-width:1180px}
 .tile{font-size:27px}.tile .n{font-size:12px}.tile .amt{font-size:11px}
}
@media (max-height:520px) and (orientation:landscape){

}

    const N={ok:[660,990],bad:[260,190],step:[440],coin:[880,1320],win:[523,659,784,1046],dice:[300,340,380]}[type]||[500];
    N.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*(type==='dice'?.05:.09);o.type=type==='bad'?'square':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='bad'?.04:type==='step'?.05:.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.18);

function toast(m,cls=''){const d=document.createElement('div');d.textContent=m;if(cls)d.className=cls;$('#toast').appendChild(d);setTimeout(()=>d.remove(),2600)}

function logLine(t,a,cat){if(R)R.log.push({d:R.pos,t,a,cat})}
function tx(a,label,cat){
  a=Math.round(a);if(!a)return;G.money+=a;logLine(label,a,cat);
  if(R){if(a<0){R.spent[cat||'autre']=(R.spent[cat||'autre']||0)-a}else R.earned+=a;R.minMoney=Math.min(R.minMoney,G.money)}
}
function toSav(x,label='Mis de côté 🐷'){x=Math.round(Math.min(x,Math.max(0,G.money)));if(x<=0)return 0;G.money-=x;G.savings+=x;logLine(label,-x,'epargne');return x}
function fromSav(x){x=Math.round(Math.min(x,G.savings));if(x<=0)return 0;G.savings-=x;G.money+=x;logLine('Retrait de l’épargne 🐷',x,'epargne');return x}
function toInv(x){x=Math.round(Math.min(x,Math.max(0,G.money)));if(x<=0)return 0;G.money-=x;G.invest+=x;logLine('Placement en bourse 📈',-x,'epargne');return x}
function payPref(x,label,cat){
  const s=Math.round(Math.min(G.savings,x));
  if(s>0){G.savings-=s;logLine(label+' (avec l’épargne)',-s,cat);R.spent[cat]=(R.spent[cat]||0)+s}
  if(x-s>0)tx(-(x-s),label,cat);
}
function apply(fx,label){
  if(!fx)return;if(typeof fx==='function')fx=fx(G)||{};
  const cat=fx.cat||'autre';
  if(fx.money)tx(fx.money,label,fx.money>0?'revenu':cat);
  if(fx.pay)payPref(fx.pay,label,cat);
  if(fx.toSavings)toSav(fx.toSavings);
  if(fx.toInvest)toInv(fx.toInvest);
  if(fx.investAdd){G.invest+=fx.investAdd;logLine('Épargne retraite (+ abondement) 📈',0,'epargne')}
  if(fx.wipeInvest)G.invest=0;
  if(fx.investMul)G.invest*=fx.investMul;
  if(fx.joy)G.joy=clamp(G.joy+fx.joy,0,100);
  if(fx.house)G.house=fx.house;if(fx.sellCar)G.car=null;
  if(fx.pocketBonus)G.pocketBonus=fx.pocketBonus;if(fx.summer)G.summer=fx.summer;
  if(fx.job)G.job=fx.job;if(fx.rent)G.rent=fx.rent;if(fx.transport)G.transport=fx.transport;if(fx.goalTxt)G.goalTxt=fx.goalTxt;
  if(fx.autoSave)G.autoSave=fx.autoSave;if(fx.boost)G.boost*=fx.boost;if(fx.car)G.car=fx.car;if(fx.debt)G.debts.push(fx.debt);
  if(fx.removeSub)G.subs=fx.removeSub==='all'?[]:G.subs.filter(s=>s.t!==fx.removeSub);
  if(R)R.minMoney=Math.min(R.minMoney,G.money);
}
function chips(fx){
  if(!fx||typeof fx==='function')return'';const a=[];
  if(fx.money)a.push([fx.money>0?'pos':'neg',sign(fx.money)]);
  if(fx.pay)a.push(['neg','−'+fmt(fx.pay)]);
  if(fx.toSavings)a.push(['sav','🐷 +'+fmt(fx.toSavings)]);
  if(fx.toInvest)a.push(['sav','📈 +'+fmt(fx.toInvest)]);
  if(fx.joy)a.push([fx.joy>0?'joy':'neg',`😊 ${fx.joy>0?'+':''}${fx.joy}`]);
  if(fx.autoSave)a.push(['sav',`🔁 ${fmt(fx.autoSave)}/mois`]);
  return a.map(([c,t])=>`<span class="chip ${c}">${t}</span>`).join('');
}

  /* ---------- Boucle d'animation ---------- */

  function proj(p,elx,dy=0){v.copy(p).project(cam);if(!elx)return;const hw=(elx.offsetWidth||120)/2;const x=clamp((v.x+1)/2*W,hw+6,W-hw-6),y=Math.max((1-v.y)/2*H+dy,(elx.offsetHeight||36)+6);elx.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`}
  function loop(){

    /* voitures */

  inv:v=>{const x=v==='all'?G.money:+v;if(toInv(x)){beep('coin');save();renderBoard();piggy()}else toast('Pas assez sur ton compte','neg')},
  toCity:()=>{if(R&&R.busy)return;G.screen='city';save();wipe('#8DB36B','🏙️',()=>{showCity();toast('Ta partie est sauvegardée. Touche le bâtiment pour reprendre !')})},
  creator:()=>creator(false),
  cset:v=>{const[k,val]=v.split('|');const n=$('#cname');if(n)window._cc.name=n.value;window._cc[k]=val;window._ccDraw()},
  csave:()=>{const c=window._cc;c.name=(($('#cname')||{}).value||c.name||'Alex').trim().slice(0,14)||'Alex';const first=!G.char;G.char=c;save();closeModal();
    if(first){G.justStarted=true;save();location.reload();return}if(city)city.refreshChar();renderCity()},
  bilanCity:()=>{const st=Object.values(G.stars).reduce((a,b)=>a+b,0);
    modal(`<div class="sh"><div class="em">📊</div><h3>Mon bilan</h3></div><div class="sb">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">${avatarSVG(G.char,64)}<div><b style="font-size:19px">${G.char?G.char.name:''}</b><div class="muted">${G.age} ans${G.job?' · '+G.job.n:''}</div></div></div>${personaRows()}
      <div class="row"><span>💳 Compte</span><b class="${G.money<0?'neg':''}">${fmt(G.money)}</b></div><div class="row"><span>🐷 Épargne</span><b>${fmt(G.savings)}</b></div>
      <div class="row"><span>📈 Placements</span><b>${fmt(G.invest)}</b></div><div class="row"><span>😊 Moral</span><b>${Math.round(G.joy)}/100</b></div>
      <div class="row"><span>⭐ Étoiles</span><b>${st} / ${PAR.length*3}</b></div>
      ${G.skill&&Object.keys(G.skill).length?`<div class="sec" style="margin:14px 0 4px">🧠 Tes réflexes (le jeu s’adapte)</div>${Object.entries(G.skill).filter(([k,v])=>SKN[k]&&v[1]).map(([k,[a,b]])=>`<div class="row"><span>${SKN[k]}</span><b class="${a/b>=.65?'pos':'neg'}">${a}/${b}</b></div>`).join('')}`:''}
      ${PAR.map((P,i)=>`<div class="row"><span>${P.ic} ${P.t}</span><b>${G.done[i]?'⭐'.repeat(G.stars[i]||0)+'☆'.repeat(3-(G.stars[i]||0)):'—'}</b></div>`).join('')}
      ${G.run?`<button class="btn" data-a="resume">▶ Reprendre ma partie en cours</button>`:''}
      <button class="btn ghost" data-a="close">Fermer</button></div>`)},
  resume:()=>{closeModal();if(G.run){R=G.run;G.screen='board';showBoard();resumeModal()}},
  settings:()=>modal(`<div class="sh"><div class="em">⚙️</div><h3>Options</h3></div><div class="sb">
    <div class="row"><span>🔊 Sons</span><button class="btn ghost" style="width:auto;margin:0;padding:8px 14px" data-a="snd">${G.sound?'Activés':'Coupés'}</button></div>
    <button class="btn ghost" data-a="tutoAgain">🎓 Revoir le tuto</button>
    <button class="btn ghost" data-a="install">📲 Installer l’application</button>
    <button class="btn ghost" data-a="reset" style="color:var(--bad)">↺ Nouveau profil, nouvelle vie</button><button class="btn" data-a="close">Fermer</button></div>`),
  snd:()=>{G.sound=!G.sound;save();A.settings()},
  tutoAgain:()=>{closeModal();tour('city',true)},
  reset:()=>modal(`<div class="sh" style="--tc:#E5484D"><div class="em">↺</div><h3>Nouvelle vie ?</h3></div><div class="sb"><p>Toute ta progression sera effacée.</p><button class="btn" style="--tc:#E5484D" data-a="resetOk">Oui, tout recommencer</button><button class="btn ghost" data-a="close">Annuler</button></div>`),
  resetOk:()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()},
  closeFin:()=>{closeModal();city&&city.focus(PAR.length-1)},dream:()=>dreamModal(),
};
/* Reprendre un parcours en cours quand on retouche son bâtiment */
const _openPar=openPar;openPar=function(i){if(G.run&&+i===G.run.p){R=G.run;G.screen='board';save();showBoard();return resumeModal()}if(G.run&&+i!==G.run.p){return modal(`<div class="sh"><div class="em">⏸️</div><h3>Partie en cours</h3></div><div class="sb"><p>Tu es en plein milieu de « ${PAR[G.run.p].t} ». Termine ce mois d’abord !</p><button class="btn" data-a="resume">▶ Reprendre</button><button class="btn ghost" data-a="close">Fermer</button></div>`)}return _openPar(i)};
function resumeModal(){
  if(!R)return;
  if(R.phase==='intro'){R.pending=null;return openIntro()}
  if(R.phase==='pay')return showPay();
  if(R.phase==='bilan')return showBilan();
  if(R.pending&&R.pending.groc&&!R.pending.res)return openGroceries();
  if(R.pending&&!R.pending.res){const sq=R.stops[R.si];showCard(cardsOf(R.pending.type)[R.pending.idx],{...TYPES[R.pending.type],place:PLACES[sq.pl]},sq)}
  else if(R.pending&&R.pending.res){R.pending=null;save();renderBoard()}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v)});

function hideLoader(){const l=$('#loader');if(l&&!l.classList.contains('gone')){l.classList.add('gone');setTimeout(()=>l.remove(),900)}}
let LP={x:innerWidth/2,y:innerHeight/2};document.addEventListener('pointerdown',e=>{LP={x:e.clientX,y:e.clientY}},true);
function wipe(color,emoji,cb){const w=$('#wipe');w.style.background=color;w.style.setProperty('--x',LP.x+'px');w.style.setProperty('--y',LP.y+'px');w.textContent=emoji||'';
  w.className='';void w.offsetWidth;w.className='on';beep('step');
  setTimeout(()=>{cb&&cb();requestAnimationFrame(()=>{w.className='on out';setTimeout(()=>{w.className=''},480)})},520)}

/* =========================================================
   APPLICATION INSTALLABLE (PWA) + TUTO
   ========================================================= */
const SVG_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>';
const SVG_ADD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
const SVG_DOTS='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>';
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function updInstall(){const b=$('#instBtn');if(b)b.classList.toggle('hidden',isStandalone())}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;updInstall()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('📲 Capylum est installé !');updInstall()});
function installModal(tab){
  tab=tab||(isIOS()?'ios':'android');const otherIOS=isIOS()&&/crios|fxios|edgios/i.test(navigator.userAgent);
  const ios=`<div class="phone"><div class="scr"><img src="icons/icon-192.png" alt=""></div><div class="bar"><span>‹</span><span>›</span><span class="ki hl">${SVG_SHARE}</span><span>📖</span><span>⧉</span></div></div>
    <ol class="steps"><li>Ouvre Capylum dans <b>Safari</b>${otherIOS?' <span class="neg">(tu es dans un autre navigateur : copie le lien et colle-le dans Safari)</span>':''}.</li>
    <li>Touche le bouton <b>Partager</b> <span class="ki">${SVG_SHARE}</span> en bas de l’écran (en haut sur iPad).</li>
    <li>Fais défiler la liste et choisis <b>« Sur l’écran d’accueil »</b> <span class="ki">${SVG_ADD}</span>.</li>
    <li>Touche <b>« Ajouter »</b> en haut à droite. L’icône Capylum apparaît sur ton écran d’accueil 🎉</li></ol>`;
  const and=`${deferredPrompt?`<button class="btn" data-a="doInstall">📲 Installer maintenant</button><p class="muted" style="text-align:center;font-size:13px;margin:8px 0 10px">ou à la main :</p>`:''}
    <div class="phone"><div class="top"><span>capylum</span><span class="ki hl">${SVG_DOTS}</span></div><div class="scr"><img src="icons/icon-192.png" alt=""></div></div>
    <ol class="steps"><li>Ouvre Capylum dans <b>Chrome</b> (ou Samsung Internet).</li>
    <li>Touche le menu <span class="ki">${SVG_DOTS}</span> en haut à droite.</li>
    <li>Choisis <b>« Installer l’application »</b> ou <b>« Ajouter à l’écran d’accueil »</b> <span class="ki">${SVG_ADD}</span>.</li>
    <li>Confirme avec <b>« Installer »</b>. Capylum s’ouvre en plein écran, comme une vraie app 🎉</li></ol>`;
  modal(`<div class="sh"><div class="ty"><span>📲 Installer l’app</span></div><div class="em">📱</div><h3>Capylum sur ton écran d’accueil</h3></div><div class="sb">
    ${isStandalone()?'<div class="verdict good"><b>C’est déjà fait ✅</b><p>Tu utilises Capylum comme une vraie application.</p></div>':''}
    <div class="tabs2"><button class="${tab==='ios'?'on':''}" data-a="instTab" data-v="ios">🍎 iPhone / iPad</button><button class="${tab==='android'?'on':''}" data-a="instTab" data-v="android">🤖 Android</button></div>
    ${tab==='ios'?ios:and}
    <p style="font-size:13px;color:var(--muted);margin:10px 0 0">💡 Une fois installée, l’app s’ouvre en plein écran et fonctionne même sans internet. Ta partie reste sauvegardée sur ton appareil.</p>
    <button class="btn ghost" data-a="close">Fermer</button></div>`);
}
Object.assign(A,{
  install:()=>installModal(),instTab:v=>installModal(v),
  doInstall:async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;closeModal();updInstall();if(r.outcome==='accepted')toast('📲 Installation en cours…')},
  daymode:()=>{const m=['auto','day','night'];G.daymode=m[(m.indexOf(G.daymode||'auto')+1)%3];save();toast({auto:'🔄 Cycle jour / nuit automatique',day:'☀️ Toujours de jour',night:'🌙 Toujours de nuit'}[G.daymode])},
});
updInstall();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* Étoiles du ciel */
(()=>{const st=$('#stars');if(!st)return;let sh='';for(let i=0;i<110;i++){const x=Math.random()*100,y=Math.random()*70,a=(.4+Math.random()*.6).toFixed(2);sh+=`${sh?',':''}${x.toFixed(1)}vw ${y.toFixed(1)}vh 0 ${Math.random()<.15?1:0}px rgba(255,255,255,${a})`}st.style.boxShadow=sh;st.style.background='#fff'})();
setTimeout(hideLoader,8000);
</script>

else{
